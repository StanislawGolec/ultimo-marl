services:
  marl-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: stanislawgolec/ultimo-marl:latest
    container_name: ultimo-marl-bot
    restart: unless-stopped
    command: ["--host=${ULTIMO_HOST:-127.0.0.1}", "--port=${ULTIMO_PORT:-8080}", "--name=DeepUltimo_Cloud", "--strategy=heuristic"]
    environment:
      - PYTHONUNBUFFERED=1
    network_mode: "host"
