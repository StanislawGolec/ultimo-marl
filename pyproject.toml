[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultimo-marl"
version = "0.1.0"
description = "Multi-Agent Reinforcement Learning (MARL) ecosystem and live inference bot for the card game Ultimo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Stanisław Golec" }
]
keywords = [
    "reinforcement-learning",
    "marl",
    "dueling-dqn",
    "pettingzoo",
    "gymnasium",
    "pytorch",
    "imperfect-information-games",
    "game-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "gymnasium>=0.29.0",
    "pettingzoo>=1.24.0",
    "tensorboard>=2.15.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
ultimo-live-bot = "ultimo_marl.run_live_bot:main"
ultimo-train = "ultimo_marl.train:main"
ultimo-evaluate = "ultimo_marl.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ultimo_marl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ultimo_marl"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pettingzoo.*",
    "gymnasium.*",
    "matplotlib.*",
    "pandas.*",
    "tensorboard.*",
    "torch.*",
    "scipy.*",
    "onnx.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
